{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: var(--content-width); padding-top: 32px; padding-bottom: 100px;">
  {% include "_post.html" %}

  <div class="comment-composer">
    <form method="post" action="{{ url_for('posts.add_comment', post_id=post.id) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="text" name="body" placeholder="Write a comment..." maxlength="1000" required>
      <button type="submit" class="btn btn-gradient">Reply</button>
    </form>
  </div>

  <div class="comment-list">
    {% for c in comments %}
      <div class="comment">
        <a href="{{ url_for('main.profile', username=c.username) }}" class="post-avatar" style="width:32px;height:32px;"></a>
        <div>
          <div class="comment-head">
            <a href="{{ url_for('main.profile', username=c.username) }}" class="post-name">
              {{ c.display_name if c.show_real_name else c.username }}
            </a>
            <span class="post-meta">{{ c.created_at }}</span>
          </div>
          <div class="post-body">{{ c.body }}</div>
        </div>
      </div>
    {% else %}
      <div class="empty-state">
        <h3>No replies yet.</h3>
        <p>Be the first to say something.</p>
      </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
