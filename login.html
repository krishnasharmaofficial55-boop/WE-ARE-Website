{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to WE ARE.</p>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit" class="btn btn-gradient btn-block">Sign in</button>
    </form>

    <div class="form-footer">
      <a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a>
    </div>
    <div class="form-footer">
      New here? <a href="{{ url_for('auth.register') }}">Join WE ARE.</a>
    </div>
  </div>
</div>
{% endblock %}
