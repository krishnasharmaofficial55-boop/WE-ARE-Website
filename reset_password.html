{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    <h1>Set a new password</h1>
    <p class="subtitle">Choose something you haven't used before.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="10" autofocus>
        <div class="field-hint">At least 10 characters.</div>
      </div>
      <button type="submit" class="btn btn-gradient btn-block">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
