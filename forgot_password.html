{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="card auth-card">
    {% if sent %}
      <h1>Check your email</h1>
      <p class="subtitle">If that email has an account, a reset link is on its way.</p>
      <a href="{{ url_for('auth.login') }}" class="btn btn-ghost btn-block">Back to sign in</a>
    {% else %}
      <h1>Reset your password</h1>
      <p class="subtitle">We'll send a link to reset it.</p>
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <button type="submit" class="btn btn-gradient btn-block">Send reset link</button>
      </form>
      <div class="form-footer"><a href="{{ url_for('auth.login') }}">Back to sign in</a></div>
    {% endif %}
  </div>
</div>
{% endblock %}
